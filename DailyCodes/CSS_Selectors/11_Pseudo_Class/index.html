<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pseudo-class Selector</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Pseudo-class Selectors</h1>

    <h2>1. Hover and Active</h2>

    <h2>2. Focus</h2>

    <input type="text" placeholder="Enter your name">

    <h2>3. First Child</h2>

    <div>
        <p>First paragraph</p>
        <p>Second paragraph</p>
        <p>Third paragraph</p>
    </div>

    <h2>4. Nth Child</h2>

    <ul>
        <li>Apple</li>
        <li>Banana</li>
        <li>Mango</li>
        <li>Orange</li>
        <li>Grapes</li>
    </ul>

</body>
</html>
