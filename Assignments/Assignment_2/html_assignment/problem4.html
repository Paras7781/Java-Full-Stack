<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Attributes in Action</title>
</head>
<body>
    <h1>Attributes in Action</h1>
    <p title="This extra information appears when you hover over this paragraph.">Move your mouse over this paragraph to see its title attribute.</p>
    <h2>Student List</h2>
    <p title="Student number one" style="color: red;">Student 1: Ashish</p>
    <p title="Student number two" style="color: blue;">Student 2: Rahul</p>
    <p title="Student number three" style="color: green;">Student 3: Kanha</p>
    <h2>Sample Image</h2>
    <img src="images/mountain.svg" alt="Illustration of a mountain, sun, and green hills" width="400" height="240">
    <p>The image uses src, alt, width, and height attributes. All attribute values are enclosed in quotation marks.</p>

</body>
</html>
