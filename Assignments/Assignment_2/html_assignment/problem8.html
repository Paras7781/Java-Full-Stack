<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Image Gallery</title>
</head>
<body>
    <h1>My Image Gallery</h1>
    <p>Here are four sample illustrations stored in the images folder.</p>
    <figure>
        <a href="images/mountain.svg"><img src="images/mountain.svg" alt="Mountain landscape with the sun above the hills" width="300" height="180"></a>
        <figcaption>Mountain landscape (click the image to open the image file)</figcaption>
    </figure>
    <figure>
        <img src="images/forest.svg" alt="Green forest with tall trees" width="300" height="180">
        <figcaption>Forest</figcaption>
    </figure>
    <figure>
        <img src="images/ocean.svg" alt="Blue ocean waves under a sunny sky" width="300" height="180">
        <figcaption>Ocean</figcaption>
    </figure>
    <figure>
        <img src="images/city.svg" alt="City skyline with buildings and clouds" width="300" height="180">
        <figcaption>City</figcaption>
    </figure>

</body>
</html>
